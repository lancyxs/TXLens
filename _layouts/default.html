<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 标题完全由页面 front matter 决定，不追加站点标题（覆盖 GitHub Pages 默认模板） -->
    <title>{{ page.title | default: "TXLens" }}</title>
    <style>
        /* TXLens 视觉识别：与门户页 index.html 一致 */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #202038;
            background-image: radial-gradient(circle at 50% 30%, rgba(153, 69, 255, 0.08) 0%, transparent 55%);
            margin: 0;
            padding: 40px 16px;
            box-sizing: border-box;
        }
        .doc-card {
            max-width: 760px;
            margin: 0 auto;
            background: #FAF8EF;
            border-radius: 24px;
            padding: 44px 48px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            color: #4a4238;
            line-height: 1.75;
            font-size: 15px;
        }
        .doc-card h1 {
            color: #202038;
            letter-spacing: 0.5px;
            margin-top: 0;
            line-height: 1.3;
        }
        .doc-card h2 {
            color: #8F7A66;
            margin-top: 34px;
            margin-bottom: 10px;
        }
        .doc-card p { margin: 10px 0; }
        .doc-card a { color: #9945FF; }
        .doc-card ul, .doc-card ol { padding-left: 22px; }
        .doc-card li { margin: 6px 0; }
        .doc-card hr { border: none; border-top: 1px solid #e8e0d8; margin: 28px 0; }
        .back-link {
            display: block;
            text-align: center;
            margin: 26px auto 0;
            color: #FAF8EF;
            opacity: 0.7;
            text-decoration: none;
            font-size: 14px;
            transition: opacity 0.3s ease;
        }
        .back-link:hover { opacity: 1; }
        @media (max-width: 600px) {
            body { padding: 16px 10px; }
            .doc-card { padding: 26px 20px; border-radius: 18px; }
        }
    </style>
</head>
<body>
    <div class="doc-card">{{ content }}</div>
    <a class="back-link" href="./">&larr; TXLens</a>
</body>
</html>
